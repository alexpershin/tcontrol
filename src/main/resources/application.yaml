spring:
  application:
    name: tcontrol-boot

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger
  enable-data-rest: true

main-config:
  sensorValuesBufferSize: 20
  sensorsStub: false

w1DevicesPath: /sys/bus/w1/devices

dataFile: data.csv

sensor-config:
  schedule: '0 0/1 * * * ?'
  sensors:
    - id: 0
      code: '28-000002c7c3ee'
      name: house
      type: TEMPERATURE
      userName: Дом
      description: Датчик в коридоре
      lowThreshold: 8.0
      highThreshold: 30.0
      thresholdLag: 2.0
    - id: 1
      code: '28-031701a152ff'
      name: street
      type: TEMPERATURE
      user-name: Улица
      description: 'Датчик на северной стороне дома'
      lowThreshold: 8.0
      highThreshold: 30.0
      thresholdLag: 2.0
    - id: 2
      code: '28-000002c7eed3'
      name: basement
      type: TEMPERATURE
      userName: Подвал
      description: 'Подвал'
      lowThreshold: 8.0
      highThreshold: 30.0
      thresholdLag: 2.0
    - id: 3
      code: '28-0000058ddc1d'
      name: case
      type: TEMPERATURE
      userName: Щит
      description: 'Щит в коридоре'
      lowThreshold: 8.0
      highThreshold: 32.0
      thresholdLag: 2.0
    - id: 4
      code: '28-0417019b15ff'
      name: veranda
      type: TEMPERATURE
      userName: Веранда
      description: 'Веранда'
      lowThreshold: 4.0
      highThreshold: 30.0
      thresholdLag: 1.0
    - id: 5
      code: '28-0317017a6aff'
      name: my-room
      type: TEMPERATURE
      userName: Комната Алексея
      description: ''
      lowThreshold: 8.0
      highThreshold: 30.0
      thresholdLag: 1.0
    - id: 6
      code: '28-031701e06cff'
      name: hot-watter
      type: TEMPERATURE
      userName: Горячая вода
      description: 'Горячая вода'
      lowThreshold: 34.0
      highThreshold: 45.0
      thresholdLag: 2.0
    - id: 7
      code: '0'
      name: battery
      type: VOLTAGE
      userName: Батарея
      description: 'Батарея 12в'
      lowThreshold: 11.5
      highThreshold: 15.0
      thresholdLag: 0.5
    - id: 8
      code: '1'
      name: electricity
      type: VOLTAGE
      userName: Сеть
      description: 'Электричество 220в'
      lowThreshold: 190
      highThreshold: 250
      thresholdLag: 10
    - id: 9
      code: '1'
      name: electricHeater
      type: ON_OFF
      userName: "Электрокотел"
      description: 'Электрокотел в прихожей'

sms-config:
  inputFolder: /var/spool/gammu/inbox
  outputFolder: /var/spool/gammu/outbox
  processedFolder: /var/spool/gammu/processed
  schedule: '0/15 * * * * ?'
  heatingPin: 'GPIO 0'
  forwardingPhone: 79210972100
  phones:
    - phone: 79210972100
      name: megafon
    - phone: 79112403797
      name: MTS
    - phone: 79119378212
      name: mama

relay-pins:
  pins:
    - pinId: 100
      pin: 'GPIO 0'
      name: 'el-heater'
      userName: "Электрический котел"
    - pinId: 101
      pin: 'GPIO 1'
      name: 'gas-heater'
      userName: "Газовый котел"
    - pinId: 102
      pin: 'GPIO 2'
      name: 'veranda-circulation'
      userName: "Веранда контур"
    - pinId: 103
      pin: 'GPIO 3'
      name: 'my-room'
      userName: "Моя комната"
    - pinId: 104
      pin: 'GPIO 4'
      name: 'big-room'
      userName: "Большая комната"
    - pinId: 105
      pin: 'GPIO 5'
      name: 'gas-heater-button-on'
      userName: "Кнопка вкл/выкл газового котла"
    - pinId: 106
      pin: 'GPIO 6'
      name: 'hot-watter'
      userName: "Горячая вода"
    - pinId: 125
      pin: 'GPIO 25'
      name: 'solar-supply'
      userName: "Питание от солнечной панели"

thermostat.schedule: '5 0/1 * * * ?'

thermostat-electro:
  tDay: 14.0
  tNight: 16.0
  delta: 0.5
  nightBegin: 23:10:00
  nightEnd: 7:10:00
  sensor: 28-000002c7c3ee
  relayPins:
    - 'GPIO 0'

voltage-monitor:
  schedule: '0/30 * * * * ?'
  pins:
    - code: 0
      ratio: 0.021788
      unit: V
    - code: 1
      ratio: 0.33190
      unit: V

thermostat-gas:
  tDay: 22.0
  tNight: 19.0
  delta: 0.3
  nightBegin: 22:00:00
  nightEnd: 8:00:00
  sensor: 28-000002c7c3ee
  relayPins:
    - 'GPIO 1'
    - 'GPIO 4'

thermostat-veranda:
  tDay: 6.0
  tNight: 6.0
  delta: 0.5
  nightBegin: 21:00:00
  nightEnd: 8:00:00
  sensor: 28-0417019b15ff
  relayPins:
    - 'GPIO 2'

thermostat-veranda-em:
  tDay: 4.0
  tNight: 4.0
  delta: 0.3
  nightBegin: 22:00:00
  nightEnd: 7:00:00
  sensor: 28-0417019b15ff
  relayPins:
    - 'GPIO 1'

thermostat-my-room:
  tDay: 23.5
  tNight: 20.0
  delta: 0.3
  nightBegin: 22:00:00
  nightEnd: 8:00:00
  sensor: 28-0317017a6aff
  relayPins:
    - 'GPIO 3'
    - 'GPIO 1'

thermostat-hot-watter:
  tDay: 38.5
  tNight: 38.5
  delta: 4.0
  nightBegin: 23:10:00
  nightEnd: 7:10:00
  sensor: 28-031701e06cff
  relayPins:
    - 'GPIO 6'

button-handler:
  buttonPinId: 'GPIO 5'
  buttonPinName: 'Включение котла'

relay-aggregator:
  schedule: '10 0/1 * * * ?'
  pinAggregates:
    '[GPIO 1]': 3

voltage-handler:
  schedule: '0/30 * * * * ?'
  voltageMin: 12.1
  voltageMax: 14.3
  valueId: 0
  relayPins:
    - 'GPIO 25'

electric-heater-handler:
  pin-id: 100
  sensor-id: 9
