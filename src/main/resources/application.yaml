spring:
  application:
    name: tcontrol-boot

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger
  enable-data-rest: true

logging:
  level:
    root: DEBUG

main-config:
  sensorValuesBufferExpiredMillis: 86400000 #24 hours
  sensorsStub: false
  historyDataMultiThread: false

w1DevicesPath: /sys/bus/w1/devices

dataFile: data.csv
#dataFile: data-2026-04-26.csv
#dataFile: data_log_converted2.csv

gradientDelta: 30

sensor-config:
  schedule: '0 0/15 * * * ?'
  sensors:
    - id: 0
      code: '28-000002c7c3ee'
      name: house
      type: TEMPERATURE
      userName: Коридор
      description: Датчик в коридоре
      lowThreshold: 8.0
      highThreshold: 30.0
      thresholdLag: 2.0
    - id: 1
      code: '28-031701a152ff'
      name: street
      type: TEMPERATURE
      user-name: Улица
      description: 'Датчик на северной стороне дома'
      lowThreshold: -20.0
      highThreshold: 30.0
      thresholdLag: 2.0
    - id: 2
      code: '28-000002c7eed3'
      name: basement
      type: TEMPERATURE
      userName: Подвал
      description: 'Подвал'
      lowThreshold: 8.0
      highThreshold: 30.0
      thresholdLag: 2.0
    - id: 3
      code: '28-0000058ddc1d'
      name: case
      type: TEMPERATURE
      userName: Щит
      description: 'Щит в коридоре'
      lowThreshold: 8.0
      highThreshold: 32.0
      thresholdLag: 2.0
    - id: 4
      code: '28-0417019b15ff'
      name: veranda
      type: TEMPERATURE
      userName: Веранда
      description: 'Веранда'
      lowThreshold: 4.0
      highThreshold: 30.0
      thresholdLag: 1.0
    - id: 5
      code: '28-0317017a6aff'
      name: my-room
      type: TEMPERATURE
      userName: Комната Алексея
      description: ''
      lowThreshold: 8.0
      highThreshold: 30.0
      thresholdLag: 1.0
    - id: 6
      code: '28-031701e06cff'
      name: hot-watter
      type: TEMPERATURE
      userName: Горячая вода
      description: 'Горячая вода'
      lowThreshold: 34.0
      highThreshold: 50.0
      thresholdLag: 2.0
    - id: 7
      code: '0'
      name: battery
      type: VOLTAGE
      userName: Батарея
      description: 'Батарея 12в'
      lowThreshold: 11.5
      highThreshold: 15.0
      thresholdLag: 0.5
    - id: 8
      code: '1'
      name: electricity
      type: VOLTAGE
      userName: Сеть
      description: 'Электричество 220в'
      lowThreshold: 190
      highThreshold: 250
      thresholdLag: 10
    - id: 9
      code: '100'
      name: electricHeater
      type: ON_OFF
      userName: "Электрокотел"
      description: 'Электрокотел в прихожей'
    - id: 10
      code: '101'
      name: gasHeater
      type: ON_OFF
      userName: "Газовый котел"
      description: 'Газовый котел'
    - id: 11
      code: '126'
      name: SYSTEM_ALERTS
      type: ALARM
      userName: 'Состояние системы'
      description: 'Список системных ошибок'

relay-pins:
  pins:
    - pinId: 100
      pin: 'GPIO 0'
      name: 'el-heater'
      userName: "Электрический котел"
    - pinId: 101
      pin: 'GPIO 1'
      name: 'gas-heater'
      userName: "Газовый котел"
    - pinId: 102
      pin: 'GPIO 2'
      name: 'veranda-circulation'
      userName: "Веранда контур"
    - pinId: 103
      pin: 'GPIO 3'
      name: 'my-room'
      userName: "Моя комната"
    - pinId: 104
      pin: 'GPIO 4'
      name: 'big-room'
      userName: "Большая комната"
    - pinId: 105
      pin: 'GPIO 5'
      name: 'gas-heater-button-on'
      userName: "Кнопка вкл/выкл газового котла"
    - pinId: 106
      pin: 'GPIO 6'
      name: 'hot-watter'
      userName: "Горячая вода"
    - pinId: 125
      pin: 'GPIO 25'
      name: 'solar-supply'
      userName: "Питание от солнечной панели"

sms-config:
  inputFolder: /var/spool/gammu/inbox
  outputFolder: /var/spool/gammu/outbox
  processedFolder: /var/spool/gammu/processed
  schedule: '0/15 * * * * ?'
  heatingPin: 'GPIO 0'
  forwardingPhone: 79210972100
  notForwardList:
    - 'RSCHS'
  phones:
    - phone: 79210972100
      name: megafon
    - phone: 79112403797
      name: MTS
    - phone: 79119378212
      name: mama

#thermostat.schedule: '5 0/1 * * * ?'
alerts.schedule: '10 0/10  * * * ?'

thermostats-config:
  thermostats:
    - id: 1
      schedule: '5 0/15 * * * ?'
      code: 'thermostat-electro'
      name: 'Термостат электро'
      tDay: 14.0
      tNight: 16.0
      delta: 0.5
      nightBegin: 23:10:00
      nightEnd: 7:10:00
      sensorCode: 28-000002c7c3ee
      relayPins:
        - 'GPIO 0'
    - id: 2
      code: thermostat-gas
      schedule: '5 0/15 * * * ?'
      name: 'Термостат коридор'
      tDay: 21.5
      tNight: 18.5
      delta: 0.3
      nightBegin: 21:00:00
      nightEnd: 8:00:00
      sensorCode: 28-000002c7c3ee
      relayPins:
        - 'GPIO 1'
        - 'GPIO 4'
    - id: 3
      schedule: '5 0/15 * * * ?'
      code: thermostat-veranda
      name: 'Термостат веранда циркуляция'
      tDay: 6.0
      tNight: 6.0
      delta: 0.5
      nightBegin: 21:00:00
      nightEnd: 9:00:00
      sensorCode: 28-0417019b15ff
      relayPins:
        - 'GPIO 2'
    - id: 4
      schedule: '5 0/15 * * * ?'
      code: thermostat-veranda-em
      name: 'Термостат веранда'
      tDay: 4.0
      tNight: 4.0
      delta: 0.3
      nightBegin: 22:00:00
      nightEnd: 9:00:00
      sensorCode: 28-0417019b15ff
      relayPins:
        - 'GPIO 1'
        - 'GPIO 2'
    - id: 5
      schedule: '5 0/15 * * * ?'
      code: thermostat-my-room
      name: 'Термостат комната Алексея'
      tDay: 22.0
      tNight: 19.0
      delta: 0.3
      nightBegin: 21:00:00
      nightEnd: 8:00:00
      sensorCode: 28-0317017a6aff
      relayPins:
        - 'GPIO 3'
        - 'GPIO 1'
    - id: 6
      schedule: '5 0/1 * * * ?'
      code: thermostat-hot-watter
      name: 'Термостат горячей воды'
      tDay: 38.5
      tNight: 38.5
      delta: 4.0
      nightBegin: 23:10:00
      nightEnd: 9:10:00
      sensorCode: 28-031701e06cff
      relayPins:
        - 'GPIO 6'

gas-on-command:
  name: 'GAS_ON'
  thermostats: ['thermostat-gas', 'thermostat-my-room']

gas-off-command:
  name: 'GAS_OFF'
  thermostats: ['thermostat-gas', 'thermostat-my-room']

electro-on-command:
  name: 'ELECTRO_ON'
  thermostats: ['thermostat-electro']

electro-off-command:
  name: 'ELECTRO_OFF'
  thermostats: ['thermostat-electro']

status-command:
  name: 'STATUS'
  thermostats: ['thermostat-electro', 'thermostat-gas', 'thermostat-my-room', 'thermostat-veranda']

voltage-monitor:
  schedule: '0 0/1 * * * ?'
  pins:
    - code: 0
      ratio: 0.021788
      unit: V
    - code: 1
      ratio: 0.33190
      unit: V

button-handler:
  buttonPinId: 'GPIO 5'
  buttonPinName: 'Включение котла'
  thermostat: thermostat-gas

relay-aggregator:
  schedule: '10 0/1 * * * ?'
  pinAggregates:
    '[GPIO 1]': 3
    '[GPIO 2]': 2

voltage-handler:
  schedule: '0/30 * * * * ?'
  voltageMin: 12.1
  voltageMax: 14.3
  valueId: 0
  relayPins:
    - 'GPIO 25'

electric-heater-handler:
  pin-id: 100
  sensor-id: 9
  thermostat: thermostat-electro
