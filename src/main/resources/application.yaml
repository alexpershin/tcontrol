spring:
  application:
    name: tcontrol-boot

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger
  enable-data-rest: true

main-config:
  sensorValuesBufferSize: 20
  sensorsStub: false

w1DevicesPath: /sys/bus/w1/devices

dataFile: data.csv

sensor-config:
  schedule: '0 0/1 * * * ?'
  sensors:
    - code: 28-000002c7c3ee
      id: 0
      name: house
      type: TEMPERATURE
      description: коридор
    - code: 28-031701a152ff
      id: 1
      name: street
      type: TEMPERATURE
      description: улица
    - code: 28-000002c7eed3
      id: 2
      name: basement
      type: TEMPERATURE
      description: подвал
    - code: 28-0000058ddc1d
      id: 3
      name: case
      type: TEMPERATURE
      description: щит
    - code: 28-0417019b15ff
      id: 4
      name: veranda
      type: TEMPERATURE
      description: веранда
    - code: 28-0317017a6aff
      id: 5
      name: my-room
      type: TEMPERATURE
      description: моя комната
    - code: 28-031701e06cff
      id: 6
      name: hot-watter
      type: TEMPERATURE
      description: горячая вода

sms-config:
  inputFolder: /var/spool/gammu/inbox
  outputFolder: /var/spool/gammu/outbox
  processedFolder: /var/spool/gammu/processed
  schedule: '0/15 * * * * ?'
  heatingPin: 'GPIO 0'
  forwardingPhone: 79210972100
  phones:
    - phone: 79210972100
      name: megafon
    - phone: 79112403797
      name: MTS
    - phone: 79119378212
      name: mama

thermostat.schedule: '5 0/1 * * * ?'

thermostat-electro:
  tDay: 14.0
  tNight: 16.0
  delta: 0.5
  nightBegin: 23:10:00
  nightEnd: 7:10:00
  sensor: 28-000002c7c3ee
  relayPins:
    - 'GPIO 0'

voltage-monitor:
  schedule: '0/30 * * * * ?'
  pins:
    - id: 0
      ratio: 0.021788
      unit: V
    - id: 1
      ratio: 0.33190
      unit: V

thermostat-gas:
  tDay: 22.0
  tNight: 19.0
  delta: 0.3
  nightBegin: 22:00:00
  nightEnd: 8:00:00
  sensor: 28-000002c7c3ee
  relayPins:
    - 'GPIO 1'
    - 'GPIO 4'

thermostat-veranda:
  tDay: 5.0
  tNight: 5.0
  delta: 0.5
  nightBegin: 21:00:00
  nightEnd: 8:00:00
  sensor: 28-0417019b15ff
  relayPins:
    - 'GPIO 2'

thermostat-veranda-em:
  tDay: 3.0
  tNight: 3.0
  delta: 0.3
  nightBegin: 22:00:00
  nightEnd: 7:00:00
  sensor: 28-0417019b15ff
  relayPins:
    - 'GPIO 1'

thermostat-my-room:
  tDay: 23.5
  tNight: 20.0
  delta: 0.3
  nightBegin: 22:00:00
  nightEnd: 8:00:00
  sensor: 28-0317017a6aff
  relayPins:
    - 'GPIO 3'
    - 'GPIO 1'

thermostat-hot-watter:
  tDay: 38.5
  tNight: 38.5
  delta: 4.0
  nightBegin: 23:10:00
  nightEnd: 7:10:00
  sensor: 28-031701e06cff
  relayPins:
    - 'GPIO 6'

button-controller:
  buttonPinName: 'GPIO 5'

relay-aggregator:
  schedule: '10 0/1 * * * ?'
  pinAggregates:
    '[GPIO 1]': 3

voltage-controller:
  schedule: '0/30 * * * * ?'
  voltageMin: 12.1
  voltageMax: 14.3
  valueId: 0
  relayPins:
    - 'GPIO 5'

