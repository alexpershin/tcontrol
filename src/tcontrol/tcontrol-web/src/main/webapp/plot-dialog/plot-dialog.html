<dialog id="pop-up" class="pop-up">Включается отопление</dialog>

<dialog id="plot-dialog">

    <div id="plot-dialog-tool-panel" class="plot-dialog-tool-panel">
        <label for="plot-dialog-from" id="plot-dialog-from-label" class="plot-dialog-input-label">От:</label>
        <input type="datetime-local" id="plot-dialog-from" class="plot-dialog-input" name="from"/>
        <label for="plot-dialog-to" id="plot-dialog-to-label" class="plot-dialog-input-label">До:</label>
        <input type="datetime-local" id="plot-dialog-to" class="plot-dialog-input" name="to"/>
        <button id="search-activate-btn" class="search-activate-btn">Поиск</button>
    </div>
    <div id="plot-dialog-diagram" class="plot-dialog-diagram"></div>
    <a href="#" id="plot-dialog-close-btn" class="close-button"></a>
</dialog>
