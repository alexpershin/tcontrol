<div class="header">
    <div class="logo">TControl 0.2</div>
    <div class="refreshed">Loaded: </div>
</div>
<div class="sensor_pane">
    <div class="sensor_items">
        <div id = "sensor_element" class="sensor_item" >
            <div  id="sensor_title" class="sensor_caption">Indoor</div>
            <div class="sensor_item_body">
                <div class="sensor_indicator_panel">
                    <div id="sensor_loader" class="sensor-loader"></div>
                    <div class="sensor_plot">
                        <img src="icons8-plot-16.png" alt="History" width="16">
                    </div>
                    <div class="sensor_time">12:00</div>
                    <div class="sensor_gradient" >&nbsp</div>
                </div>
                <p class="sensor_value"></p>
                <div class="sensor_indicator_panel_bottom">
                    <div class="sensor_min_value"></div>
                    <div class="sensor_min_time"></div>
                    <div class="sensor_max_value"></div>
                    <div class="sensor_max_time"></div>
                </div>
            </div>
        </div>
    </div>
</div>
