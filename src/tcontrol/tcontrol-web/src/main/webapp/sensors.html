<!DOCTYPE html>
<html>
    <head>
        <title>Sensors</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta charset="UTF-8">
        <script src="js/jquery/jquery-2.1.1.js" type="text/javascript"></script>
        <script src="js/jquery/jquery-dateFormat.js" type="text/javascript"></script>
        <script src="js/sensors.js" type="text/javascript"></script>
        <link rel="stylesheet" type="text/css" href="sensors.css" media="screen" />
        <script>
            $(function() {
                $("#includedContent").load("sensors-body.html",function() {
                    renderSensorsOnLoad();
                });
            });
            document.onreadystatechange = function () {
                if (document.readyState !== "complete") {
                    document.querySelector(
                        "body").style.visibility = "hidden";
                    document.querySelector(
                        "#loader").style.visibility = "visible";
                } else {
                    document.querySelector(
                        "#loader").style.display = "none";
                    document.querySelector(
                        "body").style.visibility = "visible";
                }
            };
        </script> 
    </head>

    <dialog id="pop-up">Включается отопление</dialog>

    <dialog id="start-heating">
        <h4>Введите целевую температуру</h4>
        <div class="start-heating-form-group">
            <label for="start-heating-input" class="col-form-label">Температура:</label>
            <input
                    id="start-heating-input"
                    type="number"
                    name="start-heating-input"
                    class="start-heating-input"
                    min="6" max="30" value="20">
            <br><br>
        </div>
        <button id="start-heating-apply-btn" class="start-heating-apply-btn">Применить</button>
        <button id="start-heating-close-btn" class="start-heating-close-btn">Закрыть</button>
    </dialog>

    <body class="page_body">
        <div id="includedContent"></div>
        <div id="loader" class="center"></div>
    </body>
</html>
