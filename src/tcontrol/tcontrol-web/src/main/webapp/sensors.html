<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>Sensors</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta charset="UTF-8">
        <script src="js-lib/jquery/jquery-2.1.1.js" type="text/javascript"></script>
<!--        <script src="js/jquery/jquery-dateFormat.js" type="text/javascript"></script>-->
        <script src="sensors.js" type="module"></script>

        <script src="start-heating-dialog/start-heating.js" type="module"></script>
        <script src="plot-dialog/plot-dialog.js" type="module"></script>
        <script src="alerts-dialog/alerts-dialog.js" type="module"></script>
        <link rel="stylesheet" type="text/css" href="start-heating-dialog/start-heating.css" media="screen" />
        <link rel="stylesheet" type="text/css" href="sensors.css" media="screen" />
        <link rel="stylesheet" type="text/css" href="sensors-body.css" media="screen" />
        <link rel="stylesheet" type="text/css" href="plot-dialog/plot-dialog.css" media="screen" />
        <link rel="stylesheet" type="text/css" href="alerts-dialog/alerts-dialog.css" media="screen" />
        <link rel="stylesheet" type="text/css" href="dialog.css" media="screen" />

        <!--        <script src="//cdn.jsdelivr.net/npm/eruda"></script>-->
        <!--        <script>eruda.init();</script>-->
    </head>

    <body class="page_body">
        <div id="includedContent"></div>
        <div id="loader" class="loader-center"></div>
        <div id="overlay" class="overlay"></div>
    </body>

    <div id="start-heating-dialog-placeholder"></div>
    <div id="plot-dialog-placeholder"></div>
    <div id="alerts-dialog-placeholder"></div>

    <script>
        $(function(){
              $("#start-heating-dialog-placeholder").load("start-heating-dialog/start-heating.html", function() {
                $.getScript("start-heating-dialog/start-heating.js")
                        .done( function(script, textStatus){
                                console.log("Loading start-heating.js: " + textStatus)
                        })
                        .fail(function( jqxhr, settings, exception ) {
                             console.error("Exception thrown while loading module start-heating.js", exception)
                        })
              })
              $("#alerts-dialog-placeholder").load("alerts-dialog/alerts-dialog.html", function() {
                $.getScript("alerts-dialog/alerts-dialog.js")
                        .done( function(script, textStatus){
                             console.log("Loading alerts-dialog.js: " + textStatus)
                        })
                        .fail(function( jqxhr, settings, exception ) {
                             console.error("Exception thrown while loading module alerts-dialog.js", exception)
                        })
              })
              $("#plot-dialog-placeholder").load("plot-dialog/plot-dialog.html", function(){
                    $.getScript("plot-dialog/plot-dialog.js")
                        .done( function(script, textStatus){
                             console.log("Loading plot-dialog.js: " + textStatus)
                        })
                        .fail(function( jqxhr, settings, exception ) {
                             console.error("Exception thrown while loading module plot-dialog.js", exception)
                        })
              })
        });

        $(function() {
               $("#includedContent").load("sensors-body.html", function() {
                    $.getScript("js/sensors.js")
                        .done( function(script, textStatus){
                                console.log("Loading sensors.js: " + textStatus)
                                renderSensorsOnLoad()
                        })
                        .fail(function( jqxhr, settings, exception ) {
                             console.error("Exception thrown while loading module sensors.js", exception)
                        })
               })
        })

    </script>

</html>
