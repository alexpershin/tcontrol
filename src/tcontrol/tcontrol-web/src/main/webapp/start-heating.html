<dialog id="pop-up" class="pop-up">Включается отопление</dialog>

<dialog id="start-heating" class="common-dialog-style">
    <div id="start-heating-dialog-title" class="dialog-title"></div>
    <div class="start-heating-form-group">


        <table id="thermostat-table" class="thermostat-table">
            <tr id="thermostat-table-row" class="thermostat-table-row">
                <td><label for="start-heating-input"
                           id="start-heating-input-caption"
                           class="start-heating-input-caption"
                >
                    Целевая температура:
                </label></td>
                <td><input
                        id="start-heating-input"
                        type="number"
                        name="start-heating-input"
                        class="start-heating-input"
                        min="4" max="30" value="20" maxlength="2" pattern="\d*"></td>
            </tr>
        </table>
    </div>
    <a href="#" id="start-heating-close-btn" class="close-button"></a>
    <button id="start-heating-rollback-btn" class="dialog-button">По умолчанию</button>
    <button id="start-heating-apply-btn" class="dialog-button">Применить</button>
</dialog>
